<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#15171c">
  <meta name="description" content="LOTTOVIP simulation platform">
  <title>LOTTOVIP — Member Foundation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./phase0/styles.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <main class="app-shell">
    <section class="screen login-screen active">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">LV</div>
        <p class="eyebrow">Supabase Foundation</p>
        <h1>LOTTO<span>VIP</span></h1>
        <p class="muted">ระบบสมาชิกและเครดิตสำหรับการจำลองเท่านั้น</p>
      </div>
      <form class="login-card glass-card" id="auth-form">
        <div class="sandbox-badge">SIMULATION ONLY</div>
        <label>ชื่อที่ใช้แสดง
          <input id="display-name" autocomplete="name" placeholder="ชื่อของคุณ">
        </label>
        <label>อีเมล
          <input id="email" type="email" autocomplete="email" required placeholder="name@example.com">
        </label>
        <label>รหัสผ่าน
          <input id="password" type="password" autocomplete="current-password" minlength="6" required>
        </label>
        <button class="primary-button" type="submit">เข้าสู่ระบบ</button>
        <button class="secondary-button" id="sign-up" type="button">สมัครสมาชิก</button>
        <button class="text-button hidden" id="sign-out" type="button">ออกจากระบบ</button>
        <p class="muted centered" id="auth-status" aria-live="polite"></p>
        <a class="secondary-button hidden" id="open-app" href="./phase0/" style="display:grid;place-items:center;text-decoration:none">เปิด Prototype</a>
      </form>
      <p class="legal-note">เครดิตจำลองไม่มีมูลค่าเงินสดและไม่สามารถถอนหรือแลกเปลี่ยนได้</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script src="./config.js"></script>
  <script src="./auth.js"></script>
  <script src="./auth-page.js"></script>
</body>
</html>
